apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Stresses CPU of target pods
kind: ChaosExperiment
metadata:
  name: cpu-stress
  namespace: litmus
  labels: {}
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups:
          - ""
          - "apps"
          - "apps.openshift.io"
          - "argoproj.io"
          - "batch"
          - "litmuschaos.io"
        resources:
          - "pods"
          - "pods/exec"
        verbs:
          - "create"
          - "list"
          - "get"
          - "patch"
          - "update"
          - "delete"
    image: "litmuschaos/litmus-go:latest"
    imagePullPolicy: "IfNotPresent"
    args:
    - -c
    - ./experiments -name cpu-stress
    command:
    - /bin/bash
    env:
    - name: TOTAL_CHAOS_DURATION
      value: '15'
    - name: RAMP_TIME
      value: ''
    - name: CHAOS_INTERVAL
      value: '5'
    - name: CPU_CORES
      value: '2'
    - name: TARGET_PODS
      value: ''
    - name: SEQUENCE
      value: 'parallel'
    labels:
      name: cpu-stress
      app.kubernetes.io/part-of: litmus

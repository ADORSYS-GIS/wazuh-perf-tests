kind: ServiceAccount
apiVersion: v1
metadata:
  namespace: ${namespace}
  name: ${service_account_name}

---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: role-cluster-manager-cdsud
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["chaos-mesh.org"]
  resources: [ "*" ]
  verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bind-cluster-manager-cdsud
subjects:
- kind: ServiceAccount
  name: ${service_account_name}
  namespace: ${namespace}
roleRef:
  kind: ClusterRole
  name: role-cluster-manager-cdsud
  apiGroup: rbac.authorization.k8s.io

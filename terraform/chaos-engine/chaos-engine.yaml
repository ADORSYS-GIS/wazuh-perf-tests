apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: ${chaos_engine_name}
  namespace: ${app_namespace}
spec:
  engineState: "active"
  appinfo:
    appns: ${app_namespace}
    applabel: ${app_label}
    appkind: 'deployment'
  chaosServiceAccount: ${chaos_service_account}
  experiments:
    - name: ${experiment_name}
      spec:
        components:
          env:
            - name: APP_NAMESPACE
              value: '${app_namespace}'
            - name: APP_LABEL
              value: '${app_label}'

apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Stresses memory of target pods
kind: ChaosExperiment
metadata:
  name: memory-stress
  namespace: litmus
  labels:
    name: memory-stress
    app.kubernetes.io/part-of: litmus
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups:
          - ""
          - "apps"
          - "apps.openshift.io"
          - "argoproj.io"
          - "batch"
          - "litmuschaos.io"
        resources:
          - "pods"
          - "pods/exec"
        verbs:
          - "create"
          - "list"
          - "get"
          - "patch"
          - "update"
          - "delete"
    image: "litmuschaos/litmus-go:latest"
    imagePullPolicy: "IfNotPresent"
    args:
    - -c
    - ./experiments -name memory-stress
    command:
    - /bin/bash
    env:
    - name: TOTAL_CHAOS_DURATION
      value: '15'
    - name: RAMP_TIME
      value: ''
    - name: CHAOS_INTERVAL
      value: '5'
    - name: MEMORY_STRESS_PERCENT
      value: '80'
    - name: TARGET_PODS
      value: ''
    - name: SEQUENCE
      value: 'parallel'
    labels:
      name: memory-stress
      app.kubernetes.io/part-of: litmus
